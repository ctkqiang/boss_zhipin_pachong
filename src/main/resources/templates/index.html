<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BOSS直聘爬虫 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet"/>
<style>
:root { --p: #ec4899; --p2: #f9a8d4; }
body { background: linear-gradient(135deg,#fdf2f8 0%,#fce7f3 100%); min-height:100vh; }
.card { background:white; border-radius:16px; box-shadow:0 4px 20px rgba(236,72,153,0.1); transition:all .3s; }
.card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(236,72,153,0.18); }
.tag { background:#fdf2f8; border:1px solid var(--p2); color:var(--p); border-radius:20px; padding:2px 10px; font-size:13px; }
.btn { background:linear-gradient(135deg,var(--p),#db2777); color:white; border-radius:12px; padding:10px 28px; font-weight:600; border:none; cursor:pointer; transition:all .3s; }
.btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(236,72,153,0.35); }
input[type=text] { border:2px solid #f9a8d4; border-radius:12px; padding:10px 16px; width:100%; outline:none; transition:all .3s; }
input[type=text]:focus { border-color:var(--p); box-shadow:0 0 0 3px rgba(236,72,153,0.15); }
.spinner { display:inline-block; width:24px; height:24px; border:3px solid #fce7f3; border-top-color:var(--p); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<nav class="bg-white/80 backdrop-blur shadow-sm sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
    <span class="text-lg font-bold text-pink-600">BOSS直聘爬虫 2026</span>
    <div class="flex gap-6 text-sm">
      <a href="/" class="text-pink-600 border-b-2 border-pink-500 pb-1 font-medium">搜索</a>
      <a href="/analysis" class="text-gray-500 hover:text-pink-500">数据分析</a>
    </div>
  </div>
</nav>

<div class="max-w-4xl mx-auto px-4 py-10">
  <div class="card p-6 mb-8 animate__animated animate__fadeIn">
    <h2 class="text-xl font-bold text-pink-600 mb-4 text-center">搜索 BOSS直聘 职位</h2>
    <form id="searchForm" class="flex gap-3">
      <input type="text" id="keyword" placeholder="输入关键词, 例如: Java开发, golang, flutter..." required/>
      <button type="submit" class="btn whitespace-nowrap">搜索</button>
    </form>
    <div class="flex gap-2 mt-3 flex-wrap">
      <span onclick="quickSearch('Java开发')" class="tag cursor-pointer hover:bg-pink-100">Java开发</span>
      <span onclick="quickSearch('golang')" class="tag cursor-pointer hover:bg-pink-100">golang</span>
      <span onclick="quickSearch('flutter')" class="tag cursor-pointer hover:bg-pink-100">flutter</span>
      <span onclick="quickSearch('前端')" class="tag cursor-pointer hover:bg-pink-100">前端</span>
      <span onclick="quickSearch('数据分析')" class="tag cursor-pointer hover:bg-pink-100">数据分析</span>
      <span onclick="quickSearch('产品经理')" class="tag cursor-pointer hover:bg-pink-100">产品经理</span>
    </div>
  </div>

  <div id="status" class="text-center py-8 text-gray-400">输入关键词开始搜索</div>
  <div id="jobList" class="space-y-4"></div>
</div>

<script>
const API = '/api/jobs';

function quickSearch(kw) {
  document.getElementById('keyword').value = kw;
  document.getElementById('searchForm').dispatchEvent(new Event('submit'));
}

document.getElementById('searchForm').addEventListener('submit', async e => {
  e.preventDefault();
  const kw = document.getElementById('keyword').value.trim();
  if (!kw) return;
  const list = document.getElementById('jobList');
  const status = document.getElementById('status');
  list.innerHTML = '';
  status.innerHTML = '<div class="spinner"></div><p class="mt-2 text-gray-400">搜索中...</p>';

  try {
    const resp = await fetch(API + '?keyword=' + encodeURIComponent(kw) + '&page=1&pageSize=10');
    const json = await resp.json();
    if (json.code !== 0) {
      status.innerHTML = '<div class="bg-yellow-50 text-yellow-800 rounded-xl p-4">' + (json.error || '未找到结果') + '</div>';
      return;
    }
    const jobs = json.data || [];
    if (jobs.length === 0) {
      status.innerHTML = '<div class="bg-yellow-50 text-yellow-800 rounded-xl p-4">未找到匹配的职位 — BOSS直聘可能限制了请求，请稍后再试</div>';
      return;
    }
    status.innerHTML = '<p class="text-gray-500 mb-2">找到 <b class="text-pink-600">' + json.total + '</b> 个职位</p>';
    jobs.forEach((job, i) => {
      const skills = (job.skills || job.tagList || []).map(t => '<span class="tag">' + t + '</span>').join('');
      list.innerHTML += '<div class="card p-5 animate__animated animate__fadeInUp" style="animation-delay:' + (i*0.05) + 's">'
        + '<div class="flex justify-between items-start"><div>'
        + '<h3 class="font-bold text-lg text-gray-800">' + (job.title || '未知职位') + '</h3>'
        + '<p class="text-gray-500 text-sm mt-1">' + (job.companyName || job.company_name || '') + '</p>'
        + '</div>'
        + '<span class="tag text-base font-semibold">' + (job.salary || '薪资面议') + '</span>'
        + '</div>'
        + '<div class="mt-3 flex items-center text-sm text-gray-400"><span class="mr-1">📍</span>' + (job.location || '未知') + '</div>'
        + (skills ? '<div class="mt-3 flex flex-wrap gap-1">' + skills + '</div>' : '')
        + '</div>';
    });
  } catch (err) {
    status.innerHTML = '<div class="bg-red-50 text-red-700 rounded-xl p-4">请求失败: ' + err.message + '</div>';
  }
});
</script>
</body>
</html>
